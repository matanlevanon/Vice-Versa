name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

jobs:
  build:
    name: Build, sign and package
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # --------------------------------------------------------------- version

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
            $isRelease = 'true'
          } else {
            $version = "0.1.0-dev.$env:GITHUB_RUN_NUMBER"
            $isRelease = 'false'
          }

          $numeric = ($version -split '-')[0]
          if ($numeric -notmatch '^\d+\.\d+\.\d+$') {
            if ($isRelease -eq 'true') {
              throw "Tag v$version is not MAJOR.MINOR.PATCH. Retag and push again."
            }
            $numeric = '0.1.0'
          }

          "version=$version"      | Out-File $env:GITHUB_OUTPUT -Append
          "numeric=$numeric"      | Out-File $env:GITHUB_OUTPUT -Append
          "is_release=$isRelease" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Building $version (assembly version $numeric)"

      # ---------------------------------------------------------- verification

      - name: Verify the keyboard map against the reference implementation
        shell: pwsh
        run: python tools/keymap_reference.py --check

      # --------------------------------------------------------------- compile

      - name: Build
        run: dotnet build ViceVersa.sln -c Release -p:Version=${{ steps.version.outputs.numeric }}

      - name: Test
        run: dotnet test tests/ViceVersa.Tests/ViceVersa.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish the portable single-file executable
        run: >
          dotnet publish src/ViceVersa/ViceVersa.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.numeric }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          -o publish/portable

      # ------------------------------------------------------ AutoHotkey build

      - name: Compile the AutoHotkey edition
        id: ahk
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/ahk, build/compiler, publish/ahk | Out-Null

          $headers = @{ 'User-Agent' = 'vice-versa-ci'; 'Authorization' = "Bearer $env:GH_TOKEN" }

          # The AutoHotkey runtime archive supplies the AutoHotkey64.exe base file.
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^AutoHotkey_2\..+\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'No AutoHotkey v2 zip in the latest release' }

          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile build/ahk.zip
          Expand-Archive build/ahk.zip -DestinationPath build/ahk -Force

          # Ahk2Exe ships from its own repository. It is NOT inside the runtime zip.
          $compiler = Invoke-RestMethod -Uri 'https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest' -Headers $headers
          $compilerAsset = $compiler.assets | Where-Object { $_.name -match '^Ahk2Exe.*\.zip$' } | Select-Object -First 1
          if (-not $compilerAsset) { throw 'No Ahk2Exe zip in the latest Ahk2Exe release' }

          Write-Host "Downloading $($compilerAsset.name)"
          Invoke-WebRequest -Uri $compilerAsset.browser_download_url -OutFile build/ahk2exe.zip
          Expand-Archive build/ahk2exe.zip -DestinationPath build/compiler -Force

          $ahk2exe = Get-ChildItem build/compiler -Recurse -Filter 'Ahk2Exe.exe' | Select-Object -First 1
          $base    = Get-ChildItem build/ahk      -Recurse -Filter 'AutoHotkey64.exe' | Select-Object -First 1
          if (-not $ahk2exe) { throw 'Ahk2Exe.exe was not found in the Ahk2Exe archive' }
          if (-not $base)    { throw 'AutoHotkey64.exe is not in the AutoHotkey archive' }

          $inFile  = (Resolve-Path 'ahk/ViceVersa.ahk').Path
          $iconOut = (Resolve-Path 'src/ViceVersa/Resources/app.ico').Path
          $outFile = Join-Path (Resolve-Path 'publish/ahk').Path 'ViceVersa-AHK.exe'

          # Ahk2Exe.exe is a GUI subsystem application. Calling it with & returns
          # immediately and leaves $LASTEXITCODE unset, so an exit code check on
          # the call site throws even when the compile succeeded. Start-Process
          # -Wait waits for a GUI process and -PassThru gives a real exit code.
          $arguments = @(
            '/in',   $inFile,
            '/out',  $outFile,
            '/base', $base.FullName,
            '/icon', $iconOut,
            '/silent'
          )

          $process = Start-Process -FilePath $ahk2exe.FullName -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Ahk2Exe exited with $($process.ExitCode)" }
          if (-not (Test-Path $outFile)) { throw 'Ahk2Exe produced no output' }
          Write-Host 'AutoHotkey edition compiled'
        env:
          GH_TOKEN: ${{ github.token }}

      # --------------------------------------------------------------- signing

      - name: Decide how to sign
        id: signing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          if [ -n "$AZURE_TENANT_ID" ]; then
            echo "mode=azure" >> "$GITHUB_OUTPUT"
            echo "Signing with Azure Artifact Signing"
          elif [ -n "$SIGNING_PFX_BASE64" ]; then
            echo "mode=pfx" >> "$GITHUB_OUTPUT"
            echo "Signing with a PFX certificate"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets are configured, so this build is unsigned and Windows will warn about it. See docs/SIGNING.md."
          fi

      # Azure Artifact Signing, formerly called Trusted Signing. Around $10 a
      # month and the only option granting SmartScreen reputation from the first
      # download. Restricted to US, Canadian, EU and UK entities.
      #
      # Microsoft renamed the action repository to Azure/artifact-signing-action.
      # The reference below still resolves through GitHub's rename redirect. When
      # you move to the new name, rename the trusted-signing-account-name input to
      # signing-account-name in both signing steps.
      - name: Sign the executables with Azure Artifact Signing
        if: steps.signing.outputs.mode == 'azure'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\publish
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the executables with a PFX certificate
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: ./tools/Sign-Files.ps1 -Path publish

      # ------------------------------------------------------------- installer

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-Iscc {
            Get-ChildItem 'C:\Program Files (x86)\Inno Setup *\ISCC.exe' -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host 'Inno Setup not preinstalled, fetching it'
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'Inno Setup is not available on this runner' }

          New-Item -ItemType Directory -Force -Path publish/installer | Out-Null

          $sourceExe = (Resolve-Path 'publish/portable/ViceVersa.exe').Path
          $outDir    = (Resolve-Path 'publish/installer').Path
          $version   = '${{ steps.version.outputs.numeric }}'

          & $iscc "/DMyAppVersion=$version" "/DSourceExe=$sourceExe" "/O$outDir" 'installer/ViceVersa.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          Get-ChildItem $outDir

      - name: Sign the installer with Azure Artifact Signing
        if: steps.signing.outputs.mode == 'azure'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\publish\installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the installer with a PFX certificate
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: ./tools/Sign-Files.ps1 -Path publish/installer

      # ------------------------------------------------------------- packaging

      - name: Assemble the release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'

          New-Item -ItemType Directory -Force -Path dist, staging/portable | Out-Null

          Copy-Item publish/portable/ViceVersa.exe staging/portable/
          Copy-Item README.md staging/portable/README.md
          Copy-Item LICENSE   staging/portable/LICENSE.txt
          Copy-Item ahk/ViceVersa.ahk staging/portable/

          # This marker is what puts the app into portable mode: settings are
          # written next to the executable instead of into AppData.
          'Vice Versa portable mode. Delete this file to store settings in AppData instead.' |
            Out-File staging/portable/portable.txt -Encoding utf8

          if (Test-Path publish/ahk/ViceVersa-AHK.exe) {
            Copy-Item publish/ahk/ViceVersa-AHK.exe staging/portable/
          } else {
            Write-Host '::warning::The AutoHotkey executable was not built, shipping the .ahk source only'
          }

          Compress-Archive -Path staging/portable/* -DestinationPath "dist/ViceVersa-$version-portable-x64.zip" -Force

          $setup = Get-ChildItem publish/installer -Filter *.exe | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName "dist/ViceVersa-$version-setup-x64.exe" }

          $files = @(Get-ChildItem dist -File)
          $lines = foreach ($file in $files) {
            "{0}  {1}" -f (Get-FileHash $file.FullName -Algorithm SHA256).Hash, $file.Name
          }
          $lines | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Report the signature status of every artifact
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status)  $($sig.SignerCertificate.Subject)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ViceVersa-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------------- release

      - name: Publish the GitHub release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Vice Versa ${{ steps.version.outputs.version }}

            - **Portable** - download the zip, right-click the file and tick Unblock, then run `ViceVersa.exe`. Nothing is installed and settings stay in the folder.
            - **Installer** - run the setup executable for a normal install with an optional Start with Windows entry.
            - **AutoHotkey edition** - `ViceVersa-AHK.exe` inside the zip, plus the readable `.ahk` source.

            Default hotkey: `Shift+F12`. Right-click the tray icon to change it.

            Check your download against `SHA256SUMS.txt`.

            Signing mode for this build: `${{ steps.signing.outputs.mode }}`.
